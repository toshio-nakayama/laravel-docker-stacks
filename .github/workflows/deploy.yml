name: Deploy Laravel Docker Stacks

on:
  push:
    branches: [ staging, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client
          pip3 install jinja2-cli

      - name: Render templates
        run: |
          jinja2 templates/traefik/docker-compose.yml.j2 templates/traefik/env.${{ github.ref_name }} --format env > templates/traefik/docker-compose.yml
          jinja2 templates/laravel/docker-compose.yml.j2 templates/laravel/env.${{ github.ref_name }} --format env > templates/laravel/docker-compose.yml
          jinja2 templates/laravel/docker/apache/000-default.conf.j2 templates/laravel/env.${{ github.ref_name }} --format env > templates/laravel/docker/apache/000-default.conf

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          # SSH_OPTS を組み立て（ポート設定があれば -p を付与）
          SSH_OPTS="-i ~/.ssh/id_rsa -o StrictHostKeyChecking=no"
          if [ -n "$SSH_PORT" ]; then
            SSH_OPTS="$SSH_OPTS -p $SSH_PORT"
          fi

          # (1) rsync 前に acme.json の権限を確保
          ssh $SSH_OPTS ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "if [ -f ~/docker-traefik/traefik/acme.json ]; then chmod 600 ~/docker-traefik/traefik/acme.json; fi"

          # (2) acme.json を除外して Traefik テンプレート同期
          rsync -av --delete \
            --exclude 'acme.json' \
            -e "ssh $SSH_OPTS" \
            templates/traefik/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/docker-traefik/traefik/

          # (3) rsync 後に acme.json を作成＆パーミッションを 600 に固定
          ssh $SSH_OPTS ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ~/docker-traefik/traefik && touch acme.json && chmod 600 acme.json"

          # (4) Laravel テンプレート同期（src/, .env を除外）
          rsync -av --delete \
            --exclude 'src/' --exclude 'src/**' --exclude '.env' \
            -e "ssh $SSH_OPTS" \
            templates/laravel/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/deploy/laravel/

      - name: Restart docker-compose services
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'EOH'
            cd ~/docker-traefik
            docker-compose pull && docker-compose down && docker-compose up -d --build
            cd ~/deploy/laravel
            mv env.${{ github.ref_name }} .env
            docker-compose pull && docker-compose down && docker-compose up -d --build
          EOH
