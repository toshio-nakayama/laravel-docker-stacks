entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":8444"
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
certificatesResolvers:
  le:
    acme:
      email: toshio.h1990@gmail.com
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web
