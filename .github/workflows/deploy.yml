name: Deploy Laravel Docker Stacks

on:
  push:
    branches: [ staging, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client
          pip3 install jinja2-cli

      - name: Render templates
        run: |
          jinja2 templates/traefik/docker-compose.yml.j2 templates/traefik/env.${{ github.ref_name }} \
            --format env > templates/traefik/docker-compose.yml
          jinja2 templates/laravel/docker-compose.yml.j2 templates/laravel/env.${{ github.ref_name }} \
            --format env > templates/laravel/docker-compose.yml

      - name: Setup SSH key from Base64 secret
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

