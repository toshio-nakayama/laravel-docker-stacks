name: Deploy Laravel Docker Stacks

on:
  push:
    branches: [ staging, main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client
          pip3 install jinja2-cli

      - name: Render templates
        run: |
          jinja2 templates/traefik/docker-compose.yml.j2 templates/traefik/env.${{ github.ref_name }} \
            --format env > templates/traefik/docker-compose.yml
          jinja2 templates/laravel/docker-compose.yml.j2 templates/laravel/env.${{ github.ref_name }} \
            --format env > templates/laravel/docker-compose.yml

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to server
        run: |
          # Traefik テンプレートをサーバへ同期
          rsync -av --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            templates/traefik/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/docker-traefik/traefik/
          # Laravel は src/ と .env を除外して同期
          rsync -av --delete \
            --exclude 'src/' --exclude 'src/**' --exclude '.env' \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            templates/laravel/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/deploy/laravel/

      - name: Restart docker-compose services
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'EOH'
            cd ~/docker-traefik
            docker-compose pull && docker-compose down && docker-compose up -d
            cd ~/deploy/laravel
            mv env.${{ github.ref_name }} .env
            docker-compose pull && docker-compose down && docker-compose up -d
          EOH
