name: Deploy Laravel Docker Stacks

on:
  push:
    branches:
      - staging
      - main

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client
          pip3 install jinja2-cli

      - name: Render Traefik Compose
        run: |
          jinja2 templates/traefik/docker-compose.yml.j2 \
            templates/traefik/env.\${{ github.ref_name }} \
            --format env > templates/traefik/docker-compose.yml

      - name: Render Laravel Compose
        run: |
          jinja2 templates/laravel/docker-compose.yml.j2 \
            templates/laravel/env.\${{ github.ref_name }} \
            --format env > templates/laravel/docker-compose.yml

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "\${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf "Host *\n  StrictHostKeyChecking no\n" >> ~/.ssh/config
          ssh-keyscan -H "\${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts || true

      - name: Sync Traefik to server
        run: |
          rsync -av --delete -e "ssh -i ~/.ssh/id_ed25519" \
            templates/traefik/ \
            \${{ secrets.SSH_USER }}@\${{ secrets.SSH_HOST }}:~/docker-traefik/traefik/

      - name: Sync Laravel to server
        run: |
          rsync -av --delete -e "ssh -i ~/.ssh/id_ed25519" \
            templates/laravel/ \
            \${{ secrets.SSH_USER }}@\${{ secrets.SSH_HOST }}:~/deploy/laravel/

      - name: Restart services on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \${{ secrets.SSH_USER }}@\${{ secrets.SSH_HOST }} bash << 'EOF2'
            # Traefik
            cd ~/docker-traefik
            docker-compose pull
            docker-compose down
            docker-compose up -d

            # Laravel
            cd ~/deploy/laravel
            mv env.\${{ github.ref_name }} .env
            docker-compose pull
            docker-compose down
            docker-compose up -d
          EOF2
