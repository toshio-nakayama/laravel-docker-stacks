name: Deploy Laravel Docker Stacks

on:
  push:
    branches:
      - staging
      - main

jobs:
  render-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install jinja2-cli
        run: pip3 install jinja2-cli

      - name: Render Traefik Compose
        run: |
          jinja2 templates/traefik/docker-compose.yml.j2 \
            templates/traefik/env.${{ github.ref_name }} \
            --format env > templates/traefik/docker-compose.yml

      - name: Render Laravel Compose
        run: |
          jinja2 templates/laravel/docker-compose.yml.j2 \
            templates/laravel/env.${{ github.ref_name }} \
            --format env > templates/laravel/docker-compose.yml

      - name: Copy Traefik stack to server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: |
            templates/traefik/:
          target: ~/deploy/traefik/

      - name: Copy Laravel stack to server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: |
            templates/laravel/:
          target: ~/deploy/laravel/

      - name: Restart services via SSH
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Traefik を再起動
            cd ~/deploy/traefik
            docker-compose pull && docker-compose up -d

            # Laravel の .env を準備して再起動
            cd ~/deploy/laravel
            mv env.${{ github.ref_name }} .env
            docker-compose pull && docker-compose up -d
